<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Business Card</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <div class="business-card">
            <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="pink-flower">
            <p class="full-name">Name</p>
            <p class="designation">Designation</p>
            <p class="company">Company</p>

            <hr>

            <p>Email address</p>
            <p>Full number</p>

            <a class="portfolio-link" href="https://your-potfolio-url.com">Portfolio</a>

            <hr>

            <div class="social-media">
                <h2>Connect with me</h2>
                <a href="https://twitter.com/skybyte_dev">Twitter</a>
                <a href="https://www.linkedin.com/in/jordan-m-48291b">LinkedIn</a>
                <a href="https://github.com/codewave-labs">GitHub</a>
            </div>

        </div>
    </body>
</html>
